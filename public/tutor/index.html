<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutor view</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,450;9..144,550;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/styles.css">
<style>
  /* ------------------------------------------------------------------ */
  /* Grey-brown glass retheme -- tutor surface only. Every value below     */
  /* re-declares a token shared/styles.css already defines; because this  */
  /* <style> tag is parsed after that stylesheet <link>, these rules win  */
  /* the cascade tie (equal specificity, later source order) without      */
  /* editing the shared file -- public/child is untouched. Component      */
  /* rules further down (.card, .chip, .stack-meter, ...) all read from   */
  /* these same custom properties, so retheming here recolors the whole   */
  /* dashboard; only shape/layout additions need new rules below.         */
  /* This surface intentionally does NOT follow prefers-color-scheme: a   */
  /* data-dense scanning dashboard reads better on one deliberate light   */
  /* grey-brown ground than an auto dark mode would, so there is no dark  */
  /* variant here (unlike an earlier pass of this file). */
  :root {
    --paper: #E7E1D6;
    --panel: rgba(251, 249, 244, 0.58);
    --panel-sunk: rgba(251, 249, 244, 0.36);
    /* Text tiers. Every text token below clears WCAG AA (4.5:1) against the
       darkest ground it can actually land on here: a status-tinted chip
       background, over a level-1 glass panel, over the page at the peak of
       its darkest radial wash -- not just flat --paper. Hierarchy between
       tiers is carried by weight/size/mono/uppercase as much as by lightness,
       so the tiers can sit close together without failing contrast.
         --ink    #2E2A22  10.98:1 paper · 12.44:1 panel · 8.22:1 worst
         --soft   #48433A   7.54:1 paper ·  8.55:1 panel · 5.65:1 worst
         --faint  #575045   6.12:1 paper ·  6.93:1 panel · 4.58:1 worst
       --deco is NOT a text color: chevrons, arrows and other purely
       decorative glyphs only (≥3:1 non-text contrast, 4.03:1 on paper). */
    --ink: #2E2A22;
    --soft: #48433A;
    --faint: #575045;
    --deco: #746B5C;
    --rule: rgba(53, 45, 32, 0.14);
    --rule-lite: rgba(53, 45, 32, 0.08);
    --glass-edge: rgba(255, 255, 255, 0.55);

    --brand: #5E6E45;
    --brand-ink: #3D4A2A;
    --brand-bg: rgba(94, 110, 69, 0.16);

    --live: #6B8F47;

    /* Status colors double as chip TEXT (shared .chip--*), so each is
       darkened (same hue/saturation, lower lightness) until it clears 4.5:1
       on the same worst-case ground as the text tiers above. The -bg tints
       keep their original hue source so chip fills don't shift. */
    --status-mastered: #265947;
    --status-mastered-bg: rgba(47, 110, 87, 0.15);
    --status-emerging: #39536B;
    --status-emerging-bg: rgba(74, 108, 140, 0.14);
    --status-weak: #853A1E;
    --status-weak-bg: rgba(164, 71, 37, 0.14);
    --status-stuck: #674609; /* extra step: .chip--stuck also sits on a second tint (relaxed decision row, active roster card) */
    --status-stuck-bg: rgba(140, 95, 12, 0.16);
    --status-decayed: #684A37;
    --status-decayed-bg: rgba(113, 80, 60, 0.14);
    --status-unmeasured: #857A69;
    --status-unmeasured-bg: rgba(133, 122, 105, 0.12);

    --shadow-sm: 0 1px 2px rgba(43, 36, 24, 0.06);
    --shadow-md: 0 10px 30px rgba(43, 36, 24, 0.12);
    --shadow-lg: 0 22px 50px rgba(43, 36, 24, 0.20);
    --shadow-focus: 0 0 0 3px var(--brand-bg);

    --r-lg: 18px;
    --r-xl: 26px;
    --r-2xl: 32px;

    --serif: "Fraunces", Georgia, serif;

    /* glass depth ladder -- level 1 sits directly on the page background
       (top-level cards/tiles), level 2 is nested one layer in (rows inside
       a level-1 card), level 3 is small chips/pills nested further still.
       Blur strength AND opacity both step down together so deeper layers
       read as further back / more see-through, per placement. */
    --glass-blur-1: blur(26px) saturate(170%);
    --glass-blur-2: blur(14px) saturate(150%);
    --glass-blur-3: blur(7px) saturate(135%);
  }

  html, body { height: 100%; }
  body {
    overflow: hidden;
    background:
      radial-gradient(1100px 620px at 6% -8%, rgba(94, 110, 69, 0.24), transparent 60%),
      radial-gradient(900px 560px at 102% -4%, rgba(140, 95, 12, 0.17), transparent 55%),
      radial-gradient(820px 520px at 32% 108%, rgba(113, 80, 60, 0.18), transparent 55%),
      var(--paper);
    background-attachment: fixed;
  }
  .wrap { height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; max-width: 1400px; margin: 0 auto; padding: var(--sp-5) var(--sp-7) var(--sp-6); }

  .tv-header { flex: 0 0 auto; display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-4); flex-wrap: wrap; margin-bottom: var(--sp-4); }
  .tv-header h1 { font-family: var(--serif); font-size: var(--text-3xl); font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .tv-meta { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--text-sm); color: var(--soft); margin-top: 4px; }
  /* Calm, purposeful motion budget for this surface: the one continuously-
     running animation on the whole dashboard is this "data is live" dot --
     everything else here animates once, on a state change, then stops. */
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 0 color-mix(in srgb, var(--live) 50%, transparent); animation: live-pulse 2s infinite; flex-shrink: 0; }
  @keyframes live-pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--live) 45%, transparent); }
    70% { box-shadow: 0 0 0 6px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }

  /* -------------------- single-screen dashboard shell -------------------- */
  /* No page scroll: #app fills the remaining viewport height below the
     header as a fixed two-column grid. Scrolling happens only inside
     .tab-panel (the one region whose content length is unbounded -- a
     long "needs extra support" list, a big routing trace, a large concept
     map). Everything else (sidebar stats, roster strip) sizes to its own
     content and never needs to scroll. */
  .dashboard-shell { flex: 1; min-height: 0; display: grid; grid-template-columns: 232px 1fr; gap: var(--sp-5); }

  .pulse-col { display: flex; flex-direction: column; gap: var(--sp-4); min-height: 0; }
  .pulse-tile {
    flex: 1; min-height: 0; background: var(--panel); border: 1px solid var(--glass-edge); border-radius: var(--r-2xl);
    backdrop-filter: var(--glass-blur-1); -webkit-backdrop-filter: var(--glass-blur-1);
    box-shadow: var(--shadow-sm); padding: 16px 18px; display: flex; align-items: center; justify-content: center; gap: 14px;
    transition: box-shadow var(--dur-fast) var(--ease-standard), transform var(--dur-fast) var(--ease-standard);
    animation: fade-up var(--dur-base) var(--ease-out);
  }
  .pulse-tile:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .pulse-gauge { flex-direction: column; text-align: center; gap: 6px; }
  .gauge-ring { position: relative; width: 104px; height: 104px; flex-shrink: 0; }
  .gauge-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .gauge-track { fill: none; stroke: var(--rule-lite); stroke-width: 10; }
  .gauge-fill { fill: none; stroke: var(--brand); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset var(--dur-slow) var(--ease-out); }
  .gauge-center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .gauge-pct { font-family: var(--serif); font-size: var(--text-2xl); font-weight: 600; color: var(--ink); }
  .pulse-label { font-size: var(--text-xs); color: var(--soft); text-transform: uppercase; letter-spacing: .05em; display: flex; align-items: center; justify-content: center; gap: 5px; }
  .pulse-label .icon { width: 12px; height: 12px; flex-shrink: 0; }
  .pulse-stat .pulse-icon {
    width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; background: var(--rule-lite); color: var(--soft);
  }
  .pulse-stat.moss .pulse-icon { background: var(--brand-bg); color: var(--brand-ink); }
  .pulse-stat.amber .pulse-icon { background: var(--status-stuck-bg); color: var(--status-stuck); }
  .pulse-stat.purple .pulse-icon { background: var(--status-decayed-bg); color: var(--status-decayed); }
  .pulse-stat .pulse-icon .icon { width: 19px; height: 19px; }
  .pulse-stat .pulse-body { min-width: 0; }
  .pulse-value { font-family: var(--serif); font-size: var(--text-2xl); font-weight: 600; line-height: 1.1; color: var(--ink); }
  .pulse-body .pulse-label { margin-top: 3px; justify-content: flex-start; }

  .right-col { min-width: 0; display: flex; flex-direction: column; gap: var(--sp-4); min-height: 0; }
  .tab-region { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .tab-region .tabbar { flex: 0 0 auto; }
  /* The panel itself never scrolls -- only the one section per tab whose
     content is unbounded does (see the .tv-fill note below it). If the
     panel scrolled as a whole, a card's rounded top edge would travel
     past the panel's own square clipping box and get flattened against
     it mid-scroll; keeping each card's box fixed and scrolling its
     content internally keeps every corner rounded no matter how far down
     a tutor has scrolled. */
  .tab-region .tab-panel { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: var(--sp-5); }
  /* Sections default to sizing themselves to their own content and
     staying put (e.g. "Needs extra support", capped at 5 rows by its own
     pagination -- it should never need to scroll). Exactly one section
     per tab-panel opts into filling the rest of the space and scrolling
     internally by carrying .tv-fill too: the routing trace under Overview,
     the full test history, the concept map, each Patterns column. */
  .tab-panel > .tv-section { flex: 0 0 auto; min-height: 0; margin-bottom: 0; }
  .tab-panel > .tv-fill { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding-right: 2px; }
  .roster-region { flex: 0 0 auto; }

  .tv-section { margin-bottom: var(--sp-5); }
  .tv-section:last-child { margin-bottom: 0; }
  .card-pad { padding: var(--sp-5) var(--sp-6) var(--sp-6); }
  /* rounder, glassier card primitive than shared/styles.css's default --
     tutor surface only (see the retheme note at the top of this block).
     This is the "level 1" glass pane: it sits directly on the page
     background, so it gets the strongest blur + highest opacity of the
     three glass tiers. */
  .card {
    border-radius: var(--r-xl); border-color: var(--glass-edge);
    backdrop-filter: var(--glass-blur-1); -webkit-backdrop-filter: var(--glass-blur-1);
  }

  .sec-h { display: flex; align-items: center; gap: var(--sp-3); margin: 0 0 var(--sp-4); font-size: var(--text-base); font-weight: var(--fw-semibold); }
  .sec-h .icon-wrap { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .sec-h .icon-wrap.amber { background: var(--status-stuck-bg); color: var(--status-stuck); }
  .sec-h .icon-wrap.magenta { background: var(--status-weak-bg); color: var(--status-weak); }
  .sec-h .icon-wrap.purple { background: var(--status-decayed-bg); color: var(--status-decayed); }
  .sec-h .icon-wrap.blue { background: var(--brand-bg); color: var(--brand-ink); }
  .sec-h .icon-wrap.gray { background: var(--rule-lite); color: var(--soft); }
  .sec-h .sec-title { flex: 1; font-family: var(--serif); font-size: var(--text-lg); font-weight: 600; letter-spacing: -0.005em; }
  .badge { font-family: var(--mono); font-size: var(--text-2xs); background: var(--rule-lite); color: var(--soft); padding: 2px 8px; border-radius: var(--r-pill); }
  .badge.amber { background: var(--status-stuck-bg); color: var(--status-stuck); }
  /* "level 3" glass -- small chips/pills nested inside a level-1 or level-2
     surface get the lightest blur of the three-tier ladder (see the
     --glass-blur-* tokens above), so depth reads consistently everywhere
     a tinted pill sits on top of a card. .chip and .pill-link are defined
     in shared/styles.css; this tutor-scoped rule only adds the blur. */
  .chip, .badge, .mono-chip, .pill-link {
    backdrop-filter: var(--glass-blur-3); -webkit-backdrop-filter: var(--glass-blur-3);
  }

  /* roster -- paginated, never horizontally scrolled */
  .roster-row { display: flex; align-items: center; gap: 8px; }
  .roster { display: flex; gap: 10px; flex: 1; min-width: 0; }
  .roster-card {
    flex: 1 1 0; min-width: 0; cursor: pointer; padding: 13px 14px; display: flex; flex-direction: column; gap: 11px;
    border-radius: var(--r-xl); border: 1.5px solid var(--glass-edge); background: var(--panel);
    backdrop-filter: var(--glass-blur-1); -webkit-backdrop-filter: var(--glass-blur-1);
    transition: border-color var(--dur-fast) var(--ease-standard), box-shadow var(--dur-fast) var(--ease-standard), transform var(--dur-fast) var(--ease-standard);
  }
  .roster-card:hover { border-color: var(--brand); box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .roster-card:active { transform: translateY(0) scale(0.98); }
  /* Tint layered OVER the panel rather than replacing it: keeps the active
     card a level-1 glass pane (same depth as its siblings) and keeps its
     text on a ground whose contrast is actually computed above. */
  .roster-card.active { border-color: var(--brand); background: linear-gradient(var(--brand-bg), var(--brand-bg)), var(--panel); animation: fade-in var(--dur-fast) var(--ease-standard); }
  .rc-top { display: flex; align-items: center; gap: 9px; }
  .avatar.md { width: 34px; height: 34px; font-size: var(--text-sm); box-shadow: 0 0 0 3px var(--panel); }
  /* shared/styles.css's avatar hues 3 and 5 put white initials at 4.37:1
     and 4.09:1 -- one step darker (same hue) clears AA; tutor-scoped. */
  .avatar[data-hue="3"] { background: #9C570D; }
  .avatar[data-hue="5"] { background: #237A42; }
  .rc-name { font-size: var(--text-md); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rc-flag { margin-left: auto; }
  .rc-count { font-size: var(--text-2xs); font-family: var(--mono); color: var(--soft); }
  .roster-card.all-card { flex: 0 0 104px; align-items: center; justify-content: center; text-align: center; color: var(--soft); font-size: var(--text-sm); font-weight: 600; gap: 6px; }
  .roster-card.all-card.active { color: var(--brand-ink); }
  .roster-card.all-card .icon { width: 18px; height: 18px; }

  /* segmented-tick illusion drawn over the shared .stack-meter (see
     shared/styles.css) via a thin repeating overlay -- purely cosmetic,
     doesn't touch the underlying markup or the child surface. */
  .roster-card .stack-meter, .concept-tile .stack-meter { position: relative; height: 7px; border-radius: var(--r-pill); }
  .roster-card .stack-meter::after, .concept-tile .stack-meter::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background: repeating-linear-gradient(90deg, transparent 0 5px, rgba(255, 255, 255, 0.4) 5px 6px);
    opacity: 0.6;
  }
  .roster-arrow {
    width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--rule); background: var(--panel);
    backdrop-filter: var(--glass-blur-3); -webkit-backdrop-filter: var(--glass-blur-3);
    display: flex; align-items: center; justify-content: center; color: var(--soft); flex-shrink: 0;
  }
  .roster-arrow .icon { width: 15px; height: 15px; }
  .roster-arrow:disabled { opacity: 0.35; cursor: default; }
  .roster-arrow:not(:disabled):hover { border-color: var(--brand); color: var(--brand-ink); }
  .roster-page-note { font-size: var(--text-2xs); color: var(--faint); text-align: center; margin-top: 6px; }

  /* primary tabs */
  .tabbar { display: flex; gap: 22px; border-bottom: 1.5px solid var(--rule); margin-bottom: 16px; flex-shrink: 0; }
  .tab-btn {
    appearance: none; border: none; background: none; padding: 11px 2px; font-family: var(--sans);
    font-size: var(--text-md); font-weight: 600; color: var(--soft); cursor: pointer; position: relative;
    display: flex; align-items: center; gap: 8px; transition: color var(--dur-fast) var(--ease-standard);
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn:active { opacity: 0.7; }
  .tab-btn.active { color: var(--ink); }
  .tab-btn.active::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1.5px; height: 2px; background: var(--brand); border-radius: 2px;
    transform-origin: left; animation: grow-x var(--dur-base) var(--ease-out);
  }
  .tab-btn .icon { width: 16px; height: 16px; }
  .tab-panel { animation: fade-in var(--dur-base) var(--ease-standard); }

  /* concept-map strand sub-tabs */
  .subtabbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .subtab-btn {
    padding: 7px 15px; border-radius: var(--r-pill); border: 1.5px solid var(--rule); background: var(--panel);
    backdrop-filter: var(--glass-blur-3); -webkit-backdrop-filter: var(--glass-blur-3);
    font-family: var(--sans); font-size: var(--text-sm); font-weight: 600; color: var(--soft); cursor: pointer;
    transition: border-color var(--dur-fast) var(--ease-standard), color var(--dur-fast) var(--ease-standard), background var(--dur-fast) var(--ease-standard);
  }
  .subtab-btn:hover { border-color: var(--brand); }
  .subtab-btn:active { opacity: 0.75; }
  .subtab-btn.active { border-color: var(--brand); background: var(--brand-bg); color: var(--brand-ink); }

  /* generic pager (needs-a-human list) */
  .pager { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule-lite); }
  .pager button {
    width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--rule); background: var(--panel);
    display: flex; align-items: center; justify-content: center; color: var(--soft);
  }
  .pager .icon { width: 14px; height: 14px; }
  .pager button:disabled { opacity: 0.35; cursor: default; }
  .pager button:not(:disabled):hover { border-color: var(--brand); color: var(--brand-ink); }
  .pager .pager-note { font-size: var(--text-xs); color: var(--soft); font-family: var(--mono); }

  /* needs attention */
  .na-row { display: flex; align-items: flex-start; gap: 13px; padding: 13px 10px; border-radius: var(--r-lg); margin: 0 -10px; transition: background var(--dur-fast) var(--ease-standard); }
  .na-row + .na-row { border-top: 1px solid var(--rule-lite); }
  .na-row:hover { background: var(--panel-sunk); backdrop-filter: var(--glass-blur-2); -webkit-backdrop-filter: var(--glass-blur-2); }
  .na-body { flex: 1; min-width: 0; }
  .na-name { font-size: var(--text-md); font-weight: 600; margin-bottom: 6px; }
  .na-chips { display: flex; flex-wrap: wrap; gap: 6px; }

  /* Patterns tab: two cards side by side, often of unequal content length
     (a short cluster list next to a long retention list). Each one scrolls
     independently (via .grid-2 > .card below) rather than sharing one
     scroll with the other column -- otherwise the shorter column would
     look broken, stranded at the top with dead space while the other
     column scrolls past it. .grid-2 itself carries .tv-fill (see above)
     so it fills the tab-panel the same way every other tab's content does. */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; gap: 16px; }
  .grid-2 > .card { min-height: 0; overflow-y: auto; }
  @media (max-width: 820px) { .grid-2 { grid-template-columns: 1fr; height: auto; } .grid-2 > .card { overflow-y: visible; } }

  /* misconception clusters */
  .cluster-row { padding: 12px 0; border-bottom: 1px solid var(--rule-lite); }
  .cluster-row:last-child { border-bottom: none; padding-bottom: 2px; }
  .cluster-names { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
  .cluster-chain { display: flex; align-items: center; gap: 8px; font-size: var(--text-sm); flex-wrap: wrap; }
  .cluster-chain .node { font-family: var(--mono); font-size: var(--text-2xs); padding: 4px 9px; border-radius: 6px; background: var(--rule-lite); color: var(--ink); }
  .cluster-chain .node.root { background: var(--status-weak-bg); color: var(--status-weak); font-weight: 600; }
  .cluster-chain .arrow { width: 13px; height: 13px; color: var(--deco); flex-shrink: 0; }

  /* retention */
  .ret-row { padding: 12px 0; border-bottom: 1px solid var(--rule-lite); }
  .ret-row:last-child { border-bottom: none; padding-bottom: 2px; }
  .ret-head { display: flex; justify-content: space-between; gap: 8px; font-size: var(--text-md); margin-bottom: 8px; }
  .ret-head .name { font-weight: 600; }
  .ret-head .concept { color: var(--soft); font-size: var(--text-sm); }
  .ret-val { font-family: var(--mono); font-size: var(--text-2xs); color: var(--status-decayed); white-space: nowrap; }

  /* concept map */
  .strand-block { margin-bottom: 20px; }
  .strand-block:last-child { margin-bottom: 0; }
  .strand-label { font-size: var(--text-2xs); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin-bottom: 10px; }
  .concept-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(172px, 1fr)); gap: 11px; }
  .concept-tile { border: 1px solid var(--rule); border-radius: var(--r-lg); padding: 12px 13px; background: var(--panel-sunk); backdrop-filter: var(--glass-blur-2); -webkit-backdrop-filter: var(--glass-blur-2); display: flex; flex-direction: column; gap: 9px; transition: box-shadow var(--dur-fast) var(--ease-standard), border-color var(--dur-fast) var(--ease-standard), transform var(--dur-fast) var(--ease-standard); animation: fade-in var(--dur-base) var(--ease-standard); }
  .concept-tile:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .concept-tile .cid { font-family: var(--mono); font-size: var(--text-2xs); color: var(--faint); display: block; }
  .concept-tile .clabel { font-size: var(--text-sm); line-height: 1.35; color: var(--ink); }
  .concept-tile .cfoot { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: auto; }
  .concept-tile .cfoot .n { font-family: var(--mono); font-size: var(--text-2xs); color: var(--soft); }
  .concept-tile.unmeasured { border-style: dashed; }
  .concept-tile.unmeasured .clabel { color: var(--soft); }
  .concept-tile.solo-mastered { border-color: var(--status-mastered); background: var(--status-mastered-bg); }
  .concept-tile.solo-emerging { border-color: var(--status-emerging); background: var(--status-emerging-bg); }
  .concept-tile.solo-decayed { border-color: var(--status-decayed); background: var(--status-decayed-bg); }
  .concept-tile.solo-stuck { border-color: var(--status-stuck); background: var(--status-stuck-bg); }

  /* strand sub-tab: authored-concept count, and strands with nothing
     authored yet read quieter (still clickable -- they show the stub row). */
  .subtab-btn .subtab-n { font-family: var(--mono); font-size: var(--text-2xs); font-weight: var(--fw-medium); margin-left: var(--sp-1); color: var(--faint); }
  .subtab-btn.active .subtab-n { color: var(--brand-ink); }
  .subtab-btn.no-authored:not(.active) { border-style: dashed; font-weight: var(--fw-medium); }

  /* Stub (graph-only, no game/items yet) concepts collapse into one muted,
     expandable row under the real tiles, so the authored ones aren't buried.
     Level-2 glass like a concept tile, dashed like "unmeasured" -- it's the
     same "no data here" family, one notch quieter. */
  .stub-row { margin-top: var(--sp-3); border: 1px dashed var(--rule); border-radius: var(--r-lg); background: var(--panel-sunk); backdrop-filter: var(--glass-blur-2); -webkit-backdrop-filter: var(--glass-blur-2); }
  .concept-grid:empty + .stub-row { margin-top: 0; }
  .stub-toggle {
    width: 100%; display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-3) var(--sp-4);
    background: none; border: none; border-radius: inherit; font-family: inherit; font-size: var(--text-sm); color: var(--soft); text-align: left; cursor: pointer;
    transition: background var(--dur-fast) var(--ease-standard);
  }
  .stub-toggle:hover { background: var(--rule-lite); }
  .stub-toggle .stub-n { font-family: var(--mono); font-size: var(--text-2xs); color: var(--soft); background: var(--rule-lite); padding: 2px 8px; border-radius: var(--r-pill); }
  .stub-toggle .stub-note { margin-left: auto; font-size: var(--text-2xs); color: var(--faint); }
  .stub-chevron { width: 15px; height: 15px; color: var(--deco); flex-shrink: 0; }
  .stub-chevron .icon { width: 15px; height: 15px; }
  .stub-chevron.open { transform: rotate(180deg); animation: chevron-open var(--dur-fast) var(--ease-standard); }
  .stub-list { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 var(--sp-4) var(--sp-4); animation: fade-up var(--dur-base) var(--ease-out); }
  .stub-list .mono-chip { color: var(--soft); background: transparent; border: 1px solid var(--rule); max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .strand-empty { font-size: var(--text-sm); color: var(--soft); margin-bottom: var(--sp-3); }

  /* Static one-liner above the legend: p_mastery is recency-weighted. --soft is 7.54:1 on paper. */
  .recency-note { margin-top: 16px; font-size: var(--text-xs); color: var(--soft); line-height: var(--lh-normal); }
  .recency-note + .legend { margin-top: 8px; }
  .legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--rule-lite); font-size: var(--text-xs); color: var(--soft); }
  .legend .item { display: flex; align-items: center; gap: 6px; }
  .legend .sw { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

  .empty { color: var(--soft); font-size: var(--text-md); font-style: italic; padding: 4px 0; }

  /* reusable mono concept badge, same visual as .cluster-chain .node but usable standalone */
  .mono-chip { font-family: var(--mono); font-size: var(--text-2xs); padding: 3px 9px; border-radius: 6px; background: var(--rule-lite); color: var(--ink); white-space: nowrap; }

  /* test history -- list of past tests, each expandable into its questions */
  .history-list { display: flex; flex-direction: column; }
  .session-row { border-bottom: 1px solid var(--rule-lite); }
  .session-row:last-child { border-bottom: none; }
  .session-head {
    width: 100%; display: flex; align-items: center; gap: 12px; padding: 13px 10px;
    background: none; border: none; border-radius: var(--r-lg); text-align: left; font-family: inherit; color: inherit;
    transition: background var(--dur-fast) var(--ease-standard);
  }
  .session-head:hover { background: var(--panel-sunk); backdrop-filter: var(--glass-blur-2); -webkit-backdrop-filter: var(--glass-blur-2); }
  .session-chevron { width: 15px; height: 15px; color: var(--deco); flex-shrink: 0; }
  .session-chevron .icon { width: 15px; height: 15px; }
  /* Each render fully rebuilds this DOM subtree (see render() in tutor.js --
     there's no persistent-node diffing here), so a plain `transition` on
     `.open` would never actually animate: the element is born already in
     its final state. An entrance `animation` runs regardless of whether
     the node is new, so that's the technique used for every "this just
     changed state" transition on this page (this chevron, the session
     detail panel below, a newly-active roster card, the meter bars in
     shared/styles.css) rather than a transition that would silently never
     fire. */
  .session-chevron.open { transform: rotate(180deg); color: var(--brand); animation: chevron-open var(--dur-fast) var(--ease-standard); }
  @keyframes chevron-open { from { transform: rotate(0deg); } to { transform: rotate(180deg); } }
  .session-title { display: flex; flex-direction: column; gap: 2px; min-width: 148px; flex-shrink: 0; }
  .session-game { font-size: var(--text-md); font-weight: 600; }
  .session-date { font-size: var(--text-xs); color: var(--soft); font-family: var(--mono); }
  .session-concepts { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
  .session-head:hover .session-game { color: var(--brand-ink); }

  .session-detail { padding: 4px 4px 18px 31px; display: flex; flex-direction: column; gap: 4px; animation: fade-up var(--dur-base) var(--ease-out); }
  .question-row { display: flex; gap: 12px; padding: 12px 0; border-top: 1px dashed var(--rule-lite); }
  .question-row:first-child { border-top: none; }
  .q-num { font-family: var(--mono); font-size: var(--text-2xs); color: var(--faint); flex-shrink: 0; width: 26px; padding-top: 2px; }
  .q-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px; }
  .q-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .q-prompt { font-size: var(--text-md); color: var(--ink); }
  .q-answers { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: var(--text-sm); color: var(--soft); }
  .q-answer-label { color: var(--faint); }
  .q-insight { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r-md); background: var(--status-weak-bg); backdrop-filter: var(--glass-blur-2); -webkit-backdrop-filter: var(--glass-blur-2); }
  .insight-icon { width: 22px; height: 22px; border-radius: 7px; background: var(--panel); color: var(--status-weak); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .insight-icon .icon { width: 13px; height: 13px; }
  .q-insight-text { font-size: var(--text-sm); line-height: 1.5; color: var(--ink); }
  .q-blame { margin-top: 6px; font-size: var(--text-xs); color: var(--soft); }

  /* "why this next" -- collapsed-by-default glass-box routing trace panel.
     Secondary/diagnostic, so it sits visually quieter than the primary
     overview cards above it: no icon-wrap background tint on the toggle
     itself, and it stays collapsed until a tutor opts in. */
  .why-block { cursor: default; }
  .why-toggle {
    width: 100%; display: flex; align-items: center; gap: var(--sp-3); border-radius: var(--r-lg);
    background: none; border: none; padding: var(--sp-2) var(--sp-2); margin: calc(var(--sp-2) * -1); font-family: inherit; color: inherit; text-align: left; cursor: pointer;
    transition: background var(--dur-fast) var(--ease-standard);
  }
  .why-toggle:hover { background: var(--panel-sunk); backdrop-filter: var(--glass-blur-2); -webkit-backdrop-filter: var(--glass-blur-2); }
  .why-chevron { width: 15px; height: 15px; color: var(--deco); flex-shrink: 0; transition: transform var(--dur-fast) var(--ease-standard); }
  .why-chevron .icon { width: 15px; height: 15px; }
  .why-chevron.open { transform: rotate(180deg); color: var(--brand); }
  .why-hint { margin-left: auto; font-size: var(--text-2xs); color: var(--faint); font-family: var(--mono); text-transform: uppercase; letter-spacing: .06em; background: var(--rule-lite); backdrop-filter: var(--glass-blur-3); -webkit-backdrop-filter: var(--glass-blur-3); padding: 3px 9px; border-radius: var(--r-pill); }
  .why-body { margin-top: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-3); animation: fade-up var(--dur-base) var(--ease-out); }
  .why-refresh-row { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); flex-wrap: wrap; }
  .why-refresh { padding: 4px 12px; font-size: var(--text-2xs); }
  .why-note { font-size: var(--text-sm); color: var(--soft); line-height: var(--lh-normal); }
  .why-note-warn { color: var(--status-stuck); }
  .why-group-label { font-size: var(--text-2xs); font-weight: var(--fw-semibold); text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin: var(--sp-2) 0 var(--sp-1); }

  .decision-row { border: 1px solid var(--rule); border-left-width: 3px; border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4); margin-bottom: var(--sp-2); background: var(--panel-sunk); backdrop-filter: var(--glass-blur-2); -webkit-backdrop-filter: var(--glass-blur-2); }
  .decision-row:last-child { margin-bottom: 0; }
  .decision-row--included { border-left-color: var(--status-mastered); }
  /* Excluded rows read quieter via a neutral edge + no fill, never via
     opacity -- opacity would drag every text tier inside below 4.5:1. */
  .decision-row--excluded { border-left-color: var(--rule); background: transparent; }
  .decision-row--relaxed { border-left-color: var(--status-stuck); background: var(--status-stuck-bg); }
  .decision-row--wheelblock { border-left-color: var(--status-stuck); }
  .decision-top { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); flex-wrap: wrap; }
  .decision-left, .decision-right { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
  .decision-score { font-family: var(--mono); font-size: var(--text-2xs); color: var(--soft); white-space: nowrap; }
  .decision-reason { font-size: var(--text-sm); color: var(--ink); margin-top: var(--sp-2); line-height: var(--lh-snug); }
  .decision-reason-raw { font-family: var(--mono); font-size: var(--text-2xs); color: var(--faint); margin-top: 4px; }

  /* -------------------- concept tooltip -------------------- */
  /* Every place a bare concept id (N.MAG, G.PART, ...) or its resolved
     label appears carries data-concept-id (see tutor.js); a single shared
     tooltip element (built once, reused for all of them -- see
     initConceptTooltips()) is what actually renders on hover/focus. It's
     positioned in JS with `position: fixed` from the hovered element's own
     getBoundingClientRect(), specifically so it can float free of every
     scrolling ancestor (.tab-panel, .tv-fill, .grid-2 > .card) instead of
     being clipped by their overflow -- a chip near the bottom edge of a
     scrolled routing-trace list still gets a fully visible tooltip. */
  [data-concept-id] { cursor: help; }
  .concept-tooltip {
    position: fixed; z-index: 1000; max-width: 280px; padding: 10px 13px;
    background: var(--panel); border: 1px solid var(--glass-edge); border-radius: var(--r-md);
    backdrop-filter: var(--glass-blur-1); -webkit-backdrop-filter: var(--glass-blur-1);
    box-shadow: var(--shadow-lg);
    opacity: 0; transform: translateY(2px) scale(0.98); transform-origin: var(--tt-origin-y, bottom) var(--tt-origin-x, left);
    transition: opacity var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
    pointer-events: none;
  }
  .concept-tooltip.open { opacity: 1; transform: translateY(0) scale(1); }
  .concept-tooltip .tt-id { display: block; font-family: var(--mono); font-size: var(--text-2xs); color: var(--faint); letter-spacing: .02em; margin-bottom: 3px; }
  .concept-tooltip .tt-label { display: block; font-family: var(--serif); font-size: var(--text-base); font-weight: 600; line-height: 1.3; color: var(--ink); }
  .concept-tooltip .tt-meta { display: block; font-size: var(--text-2xs); color: var(--soft); margin-top: 4px; }

  /* -------------------- small-screen safety net -------------------- */
  /* The single-screen, no-page-scroll shell above is deliberate for the
     primary desktop/tablet case (a teacher scanning data), but a fixed
     232px sidebar + fixed-height roster strip cannot fit a phone width
     without becoming unreadable. Below this breakpoint the shell falls
     back to a normal scrolling single column instead -- the "no whole-page
     scroll" rule is a desktop-dashboard affordance, not achievable (or
     expected) on a phone browser. */
  @media (max-width: 880px) {
    html, body { height: auto; overflow: visible; }
    .wrap { height: auto; padding: var(--sp-6) var(--sp-4) var(--sp-8); }
    .tv-header { flex-direction: column; align-items: stretch; gap: var(--sp-2); }
    .dashboard-shell { display: flex; flex-direction: column; }
    .pulse-col { flex-direction: row; flex-wrap: wrap; }
    .pulse-col .pulse-tile { flex: 1 1 45%; }
    .tab-region .tab-panel { overflow: visible; display: block; }
    .tab-panel > .tv-section, .tab-panel > .tv-fill { margin-bottom: var(--sp-5); overflow-y: visible; }
    .tab-panel > .tv-section:last-child, .tab-panel > .tv-fill:last-child { margin-bottom: 0; }
    .roster { flex-wrap: wrap; }
    .roster-card, .roster-card.all-card { flex: 1 1 128px; }
    .session-head { flex-wrap: wrap; row-gap: var(--sp-2); }
    .session-title { min-width: 0; flex: 1 1 auto; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="tv-header">
    <div>
      <h1>Tutor view</h1>
      <div class="tv-meta"><span class="live-dot"></span><span id="meta"></span></div>
    </div>
    <a class="pill-link" href="/child/" target="_blank">
      child view
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </header>
  <div id="app" class="dashboard-shell"></div>
</div>
<script type="module" src="./tutor.js"></script>
</body>
</html>
