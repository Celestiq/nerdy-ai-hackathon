<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/styles.css">
<style>
  /* Child surface's own accent -- a warm coral that sits alongside the
     shared brand blue (tutor's accent) rather than replacing it: same
     palette family, different amplitude, per the shared design system in
     shared/styles.css. --play-on: text color for anything sitting *on top
     of* the --play/--play-ink accent (currently just .btn-primary) -- this
     page's light-only, so it only ever needs the one dark-enough-for-white-
     text value (5.4:1+), not a second variant for a dark background. */
  :root { --play: #E0592B; --play-bg: #FDECE3; --play-ink: #B8431C; --play-on: #fff; }

  /* This surface is light-only, deliberately, regardless of OS theme -- see
     "Light-only, deliberately" in DESIGN_LANGUAGE.md. A K-5 kid didn't set
     their device's dark-mode preference for this app, and a colorful,
     sunlit palette reads as "a place to play" the way a dark UI doesn't for
     this age group. Every token shared/styles.css would otherwise flip
     under `prefers-color-scheme: dark` is re-pinned here to its light value
     -- unconditionally, so it wins regardless of OS setting -- by copying
     that file's own light `:root` values verbatim rather than inventing
     new ones, so this is a *lock*, not a fork, of the shared system.
     tutor.js is untouched and keeps following the OS theme normally. */
  :root {
    --paper: #F4F6F8; --panel: #FFFFFF; --panel-sunk: #F8F9FB;
    --ink: #16202E; --soft: #5B6672; --faint: #8A93A0;
    --rule: #D6DDE5; --rule-lite: #E9EDF1;
    --brand: #2B4CD4; --brand-ink: #1E3AAE; --brand-bg: #E8EDFC;
    --live: #2A8F4E;
    --status-mastered: #0E7C82; --status-mastered-bg: #E1F2F0;
    --status-emerging: #3B63D6; --status-emerging-bg: #E9EEFC;
    --status-weak: #C0246A; --status-weak-bg: #FCEAF1;
    --status-stuck: #9A6B00; --status-stuck-bg: #FBEFD8;
    --status-decayed: #7247C4; --status-decayed-bg: #F0EAFB;
    --status-unmeasured: #97A1AC; --status-unmeasured-bg: #F1F3F5;
    --shadow-sm: 0 1px 2px rgba(20, 30, 45, 0.05);
    --shadow-md: 0 6px 20px rgba(20, 30, 45, 0.08);
    --shadow-lg: 0 16px 40px rgba(20, 30, 45, 0.16);
    color-scheme: light;
  }

  /* A small named palette for *decorative/chrome* color variety -- the
     background wash, the roster, the two sides of a choice -- kept to
     exactly the 6 hues shared/styles.css's avatar system already uses
     (`.avatar[data-hue]`), so a new color on this page is always "one the
     app already has an identity for," never an arbitrary pick. --hue-1
     (teal) is `--status-mastered` itself -- reserved for the one meaning
     that color already carries (see DESIGN_LANGUAGE.md's reward-color
     guardrail) -- so decorative use below deliberately skips it. */
  :root {
    --hue-0: #3B63D6; --hue-1: #0E7C82; --hue-2: #C0246A;
    --hue-3: #B4650F; --hue-4: #7247C4; --hue-5: #2A8F4E;
  }

  /* Fizz, the child surface's mascot (see DESIGN_LANGUAGE.md). Deliberately
     built from tokens this surface already has rather than a new palette:
     body/belly reuse --play (this page's one accent) so Fizz never competes
     with it, and the antenna spark reuses --status-mastered -- the app's
     single existing "reward" color (the mastery-pulse ring, the star map's
     bloom tier) -- rather than inventing a second reward hue. Eyes/pupils
     are fixed, not theme tokens: a mascot's face reads as illustration, not
     UI chrome, so it doesn't invert in dark mode any more than a printed
     logo would. --display is this page's own headline face (Baloo 2, round
     and bouncy -- "this is a game," matching the child surface's tone) the
     same way tutor.js's own <style> block defines a local --serif; body
     copy stays on the shared --sans so the two surfaces still read as one
     type system, just a different display face for the child surface's big
     moments. */
  :root {
    --display: "Baloo 2", var(--sans);
    --fizz-body: var(--play);
    --fizz-belly: var(--play-bg);
    --fizz-cheek: color-mix(in srgb, var(--play) 35%, white);
    --fizz-spark: var(--status-mastered);
    --fizz-spark-ink: color-mix(in srgb, var(--status-mastered) 65%, black);
  }

  /* -------------------- full-bleed, no-scroll shell --------------------
     A game should feel like a place you're standing in, not a form in the
     middle of a mostly-empty page -- and a K-5 player shouldn't have to
     discover a scrollbar mid-question. html/body are pinned to the viewport
     height; .wrap is the one flex column that owns that height, and every
     screen child.js renders gets the shared `.screen` class below so it can
     flex to fill whatever's left under its own topbar/heading. Variable-
     length content (the roster, the star map) still gets its own internal
     scroll region rather than clipping -- see .picker-scroll/.const-scroll
     -- so "no scrolling" holds for the part of the app it actually matters
     for (an in-progress question) without silently hiding a long roster. */
  html, body { height: 100%; }
  body {
    height: 100vh; height: 100dvh; overflow: hidden;
    display: flex; flex-direction: column; align-items: center;
    /* An immersive, multi-color wash behind the play surface -- four soft
       glows from the decorative hue palette above, overlapping enough to
       feel like a sunlit place rather than a form, but each one dilute
       enough (color-mix against transparent, not a flat fill) that body
       text sitting directly on it still holds contrast. */
    background:
      radial-gradient(ellipse 640px 420px at 6% -8%, color-mix(in srgb, var(--hue-3) 40%, transparent), transparent 62%),
      radial-gradient(ellipse 620px 420px at 100% -6%, color-mix(in srgb, var(--play) 34%, transparent), transparent 60%),
      radial-gradient(ellipse 560px 380px at 102% 55%, color-mix(in srgb, var(--hue-2) 24%, transparent), transparent 60%),
      radial-gradient(ellipse 760px 480px at 46% 112%, color-mix(in srgb, var(--hue-4) 26%, transparent), transparent 62%),
      var(--paper);
  }

  /* Ambient background motion -- slow color glows drifting in the margins,
     the same kind of "the world is alive behind the game" touch Toki's
     illustrated forest and Peekaboo's floating shapes both use. Two rules
     keep this from ever competing with the actual question: they're fixed
     to the viewport behind `.wrap` (z-index below it, see `.wrap` itself),
     so they only ever show in the gutters around the opaque white `.stage`
     card, never through it; and every drift is slow (22-30s) and low-
     amplitude (a few px of travel) -- peripheral atmosphere, not motion
     that asks to be watched. `z-index: 0` here + `.wrap`'s `z-index: 1`
     below is the entire mechanism; nothing else on the page needs to know
     these exist. */
  .bg-blob { position: fixed; z-index: 0; border-radius: 50%; filter: blur(28px); pointer-events: none; }
  .bg-blob--1 { width: 240px; height: 240px; left: -70px; top: -60px; background: color-mix(in srgb, var(--hue-3) 55%, transparent); animation: bg-drift-a 24s ease-in-out infinite; }
  .bg-blob--2 { width: 260px; height: 260px; right: -80px; top: 4%; background: color-mix(in srgb, var(--play) 48%, transparent); animation: bg-drift-b 27s ease-in-out infinite; }
  .bg-blob--3 { width: 220px; height: 220px; right: -60px; bottom: 6%; background: color-mix(in srgb, var(--hue-2) 42%, transparent); animation: bg-drift-a 31s ease-in-out infinite reverse; }
  .bg-blob--4 { width: 260px; height: 260px; left: 42%; bottom: -100px; background: color-mix(in srgb, var(--hue-4) 46%, transparent); animation: bg-drift-b 25s ease-in-out infinite; }
  @keyframes bg-drift-a {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(16px, -14px) scale(1.06); }
  }
  @keyframes bg-drift-b {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-14px, 16px) scale(0.96); }
  }
  @media (prefers-reduced-motion: reduce) {
    .bg-blob { animation: none; }
  }

  .wrap {
    width: 100%; max-width: 1080px; height: 100%; min-height: 0;
    padding: clamp(12px, 2.4vh, 26px) clamp(16px, 4vw, 44px) clamp(10px, 1.8vh, 18px);
    display: flex; flex-direction: column; gap: var(--sp-2);
    position: relative; z-index: 1; /* stack above .bg-blob -- see comment there */
  }
  #app { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: var(--sp-4); }
  .screen--center { align-items: center; justify-content: center; overflow-y: auto; }

  /* -------------------- "Who's playing?" picker --------------------
     Fizz greets the child (lg, with the shared .speech-bubble) above a grid
     of big avatar cards -- one per player, each washed in that player's own
     avatar hue so the roster reads as a row of distinct, friendly places.
     The grid centers itself vertically (auto margins, which unlike
     justify-content:center never make overflow unreachable) so a small
     roster doesn't leave most of the screen empty. */
  /* Head + grid are centred as one group (the scroll region only takes the
     height it needs, and shrinks -- then scrolls -- if the roster is long). */
  .screen--picker { gap: clamp(var(--sp-4), 5vh, var(--sp-9)); justify-content: center; }
  .picker-head { display: flex; align-items: flex-end; justify-content: center; gap: var(--sp-3); flex: 0 0 auto; padding-top: clamp(0px, 2vh, var(--sp-6)); }
  .picker-head .fizz--lg { width: clamp(64px, 15vh, 128px); height: clamp(64px, 15vh, 128px); }
  .picker-head h1 { font-family: var(--display); font-size: clamp(26px, 2.4vw + 1rem, 44px); font-weight: 800; margin: 0; letter-spacing: -0.01em; line-height: var(--lh-tight); color: var(--ink); }

  /* Roster can run longer than one screen (more students than fit) -- this
     is the one screen where a contained scroll region is the honest choice
     over either clipping names off the bottom or forcing the whole page to
     scroll. Only the wrapper scrolls. */
  .picker-scroll { flex: 0 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; padding: 6px; }
  .picker {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(var(--sp-3), 2.4vw, var(--sp-6));
    width: 100%; max-width: 880px; margin: auto;
  }
  /* Each roster entry is one button that opens that player's Star Path
     (the map is home; Play lives there). */
  .picker-play {
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(var(--sp-2), 1.6vh, var(--sp-4));
    min-height: clamp(104px, 23vh, 210px); padding: var(--sp-4) var(--sp-3);
    border-radius: var(--r-xl); border: 2px solid var(--rule-lite);
    background: var(--panel); color: var(--ink); box-shadow: var(--shadow-sm);
    animation: fade-up var(--dur-slow) var(--ease-out) backwards;
    transition: border-color var(--dur-fast) var(--ease-standard), box-shadow var(--dur-fast) var(--ease-standard), transform var(--dur-fast) var(--ease-bounce);
  }
  .picker-play:hover { box-shadow: var(--shadow-md); transform: translateY(-3px); }
  .picker-play:active { transform: translateY(0) scale(0.97); box-shadow: var(--shadow-sm); }
  .picker-play:focus-visible { outline: 3px solid color-mix(in srgb, var(--ink) 55%, transparent); outline-offset: 3px; }
  /* Per-player wash: a stronger tint at the top fading to white, plus a
     matching border -- each card reads as "that player's color". */
  .picker-play[data-hue] { --card-hue: var(--hue-0); }
  .picker-play[data-hue="1"] { --card-hue: var(--hue-1); }
  .picker-play[data-hue="2"] { --card-hue: var(--hue-2); }
  .picker-play[data-hue="3"] { --card-hue: var(--hue-3); }
  .picker-play[data-hue="4"] { --card-hue: var(--hue-4); }
  .picker-play[data-hue="5"] { --card-hue: var(--hue-5); }
  .picker-play[data-hue] {
    background: linear-gradient(180deg, color-mix(in srgb, var(--card-hue) 18%, var(--panel)) 0%, color-mix(in srgb, var(--card-hue) 5%, var(--panel)) 70%);
    border-color: color-mix(in srgb, var(--card-hue) 22%, var(--rule-lite));
  }
  .picker-play[data-hue]:hover { border-color: var(--card-hue); }
  .picker-avatar.avatar {
    width: clamp(48px, 10vh, 88px); height: clamp(48px, 10vh, 88px);
    font-family: var(--display); font-size: clamp(var(--text-lg), 3.4vh, var(--text-4xl)); font-weight: 700;
    box-shadow: 0 0 0 4px var(--panel), var(--shadow-md);
    transition: transform var(--dur-base) var(--ease-bounce);
  }
  .picker-play:hover .picker-avatar { transform: scale(1.06) rotate(-4deg); }
  .picker-name { font-family: var(--display); font-size: clamp(var(--text-lg), 2.8vh, var(--text-3xl)); font-weight: 700; line-height: var(--lh-tight); text-align: center; }
  @media (prefers-reduced-motion: reduce) {
    .picker-play { animation: none; }
    .picker-play:hover .picker-avatar { transform: none; }
  }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); flex: 0 0 auto; }
  .topbar .who { display: flex; align-items: center; gap: 9px; font-size: var(--text-md); font-weight: var(--fw-semibold); }
  .topbar .avatar { width: 30px; height: 30px; font-size: var(--text-xs); }
  /* In-session Home: back to the Star Path (child.js quitSession). A kid-
     sized pill, not the shared 34px .pill-link height. */
  .session-home { min-height: 44px; font-size: var(--text-md); font-weight: var(--fw-semibold); color: var(--ink); cursor: pointer; }
  .session-home .icon { width: 18px; height: 18px; }

  .stage {
    background: var(--panel); border: 1px solid var(--rule-lite); border-radius: var(--r-lg); box-shadow: var(--shadow-sm);
    padding: clamp(14px, 2.8vh, 44px) clamp(18px, 5vw, 64px);
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: clamp(var(--sp-3), 2vh, var(--sp-6));
    animation: fade-up var(--dur-base) var(--ease-out);
    /* Safety net, not the primary strategy: the four-row balance-scale item
       (prompt/subprompt/beam/two choice buttons -- the tallest stack of any
       item type this stage renders) is what the sizes below are actually
       budgeted against at a ~700px-tall window; a shorter window than that
       falls back to scrolling *inside* the card rather than clipping. */
    overflow: auto;
  }
  .prompt { font-family: var(--display); font-size: clamp(26px, 3vw + 1.2rem, 68px); font-weight: 700; letter-spacing: -0.01em; text-align: center; text-wrap: balance; line-height: var(--lh-tight); }
  .subprompt { font-size: clamp(var(--text-md), 1.6vw, var(--text-xl)); color: var(--soft); line-height: var(--lh-snug); margin-top: -6px; }

  .line-area { width: 100%; touch-action: none; }
  .line-area svg { width: 100%; height: clamp(100px, 20vh, 230px); display: block; }
  .line-track { stroke: var(--ink); stroke-width: 3; cursor: pointer; }
  .line-tick { stroke: var(--rule); stroke-width: 2; }
  .line-tick-label { font-family: var(--mono); font-size: var(--text-xs); fill: var(--soft); }
  .line-marker { fill: var(--play); stroke: var(--panel); stroke-width: 3; transition: cx var(--dur-fast) var(--ease-out); }
  .line-area svg { cursor: pointer; }
  /* While dragging, the marker follows the finger with no easing lag. */
  .line-area svg.is-dragging .line-marker { transition: none; }
  .line-area svg.is-locked { cursor: default; }
  /* "Lock it in" (numberline): disabled until a spot is placed. */
  .line-lock { margin-top: 0; min-width: clamp(160px, 24vw, 220px); font-family: var(--display); font-size: var(--text-xl); font-weight: 700; }
  .btn-primary:disabled { opacity: 0.45; cursor: default; box-shadow: none; }
  .btn-primary:disabled:hover { background: var(--play); }
  .btn-primary:disabled:active { transform: none; }

  .choice-row { display: flex; gap: clamp(var(--sp-4), 3vw, var(--sp-9)); width: 100%; justify-content: center; flex-wrap: wrap; }
  .choice-card {
    flex: 1 1 220px; max-width: 380px; min-height: 120px; border: 2px solid var(--rule); border-radius: var(--r-lg);
    padding: clamp(var(--sp-4), 3vh, var(--sp-7));
    background: var(--panel); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(10px, 2vh, 18px);
    transition: border-color var(--dur-fast) var(--ease-standard), background-color var(--dur-fast) var(--ease-standard), box-shadow var(--dur-fast) var(--ease-standard), transform var(--dur-fast) var(--ease-standard);
  }
  .choice-card:hover { border-color: var(--play); cursor: pointer; box-shadow: var(--shadow-md); transform: translateY(-1px); }
  /* Two-choice items (compare + partition, see child.js) tint their two
     cards blue/magenta -- a stable, memorable "left/right" convention kids
     can rely on across every game that offers exactly two choices, not a
     hint toward which one is correct (which side holds which value is
     randomized by the item generator, independent of this color). */
  .choice-card[data-hue="0"] { background: color-mix(in srgb, var(--hue-0) 8%, var(--panel)); border-color: color-mix(in srgb, var(--hue-0) 30%, var(--rule)); }
  .choice-card[data-hue="0"]:hover { border-color: var(--hue-0); }
  .choice-card[data-hue="2"] { background: color-mix(in srgb, var(--hue-2) 8%, var(--panel)); border-color: color-mix(in srgb, var(--hue-2) 30%, var(--rule)); }
  .choice-card[data-hue="2"]:hover { border-color: var(--hue-2); }
  .choice-card:active { transform: translateY(0) scale(0.97); box-shadow: var(--shadow-sm); }
  .bar-outer { width: 100%; height: clamp(28px, 5vh, 56px); border: 1.5px solid var(--ink); border-radius: var(--r-sm); overflow: hidden; display: flex; }
  /* Fraction bars: every bar is one whole of the same length, cut into
     `denominator` equal cells with `numerator` of them shaded (renderCompare). */
  .bar-cell { flex: 1; height: 100%; background: var(--rule-lite); border-right: 1.5px solid var(--ink); }
  .bar-cell:last-child { border-right: none; }
  .bar-cell.fill { background: var(--status-mastered); }
  .bar-label { font-family: var(--mono); font-size: clamp(var(--text-sm), 1.8vw, var(--text-xl)); color: var(--soft); }

  .partition-shape { width: 100%; height: clamp(60px, 12vh, 150px); border: 1.5px solid var(--ink); border-radius: var(--r-sm); display: flex; }
  .partition-slice { border-right: 1.5px solid var(--ink); flex: 1; }
  .partition-slice:last-child { border-right: none; }
  .partition-slice.fill { background: var(--status-mastered); }

  /* -------------------- Fizz + the path track --------------------
     The one progress mechanic every item type above funnels through --
     see renderFizz()/pathTrack() in child.js and DESIGN_LANGUAGE.md. Nodes
     reuse the star map's own "dashed = not attempted yet" convention
     (.const-star--seed below) rather than inventing a second not-yet
     language, and "done" reuses --status-mastered, the app's one reward
     color -- both choices are about staying one visual language, not two. */
  /* Fizz never quite stands still -- a slow, small idle bob (fizz-idle)
     plays continuously on every Fizz on the page, the same "the character
     is alive, not a static icon" touch the Behance research kept surfacing.
     hop/cheer are finite, one-shot animations layered on *top* of the idle
     bob (both listed together below, idle first) rather than replacing it:
     once a hop/cheer's fixed duration ends, idle -- still running -- keeps
     driving `transform` with no visible seam. Small amplitude and a slow
     3s cycle on purpose: this must read as "breathing," not as motion
     competing with the actual question for attention. */
  .fizz { display: inline-flex; flex-shrink: 0; transform-origin: 50% 100%; animation: fizz-idle 3s ease-in-out infinite; }
  .fizz svg { width: 100%; height: 100%; display: block; }
  .fizz--sm { width: 28px; height: 28px; }
  .fizz--md { width: 46px; height: 46px; }
  .fizz--lg { width: 76px; height: 76px; }
  .fizz-body { fill: var(--fizz-body); }
  .fizz-belly { fill: var(--fizz-belly); }
  .fizz-spark { fill: var(--fizz-spark); }
  .fizz-stem { fill: var(--fizz-spark-ink); }
  .fizz-eye { fill: #fff; }
  .fizz-pupil { fill: #2b2a3a; }
  .fizz-cheek { fill: var(--fizz-cheek); opacity: 0.8; }
  .fizz-hop { animation: fizz-idle 3s ease-in-out infinite, fizz-hop 0.55s var(--ease-bounce); }
  .fizz-cheer { animation: fizz-idle 3s ease-in-out infinite, fizz-cheer 0.7s var(--ease-bounce); }
  @keyframes fizz-idle {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-5%) rotate(-2deg); }
  }
  @keyframes fizz-hop {
    0% { transform: translateY(0) scaleY(1); }
    35% { transform: translateY(-42%) scaleY(1.08); }
    60% { transform: translateY(-48%) scaleY(1.12); }
    85% { transform: translateY(0) scaleY(0.92); }
    100% { transform: translateY(0) scaleY(1); }
  }
  @keyframes fizz-cheer {
    0% { transform: scale(0.4) rotate(-8deg); opacity: 0; }
    55% { transform: scale(1.18) rotate(6deg); opacity: 1; }
    75% { transform: scale(0.94) rotate(-3deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .fizz, .fizz-hop, .fizz-cheer { animation: none; }
  }

  .path-wrap { width: 100%; flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .path-track { position: relative; width: 100%; height: clamp(64px, 11vh, 108px); }
  .path-node {
    position: absolute; width: 20px; height: 20px; border-radius: 50%; transform: translate(-50%, -50%);
    border: 2px dashed var(--rule); background: transparent;
  }
  .path-node--done { border-style: solid; border-color: var(--status-mastered); background: var(--status-mastered-bg); }
  .path-fizz { position: absolute; transform: translate(-50%, -86%); z-index: 2; }

  .feedback-note { display: flex; align-items: center; gap: 10px; font-size: clamp(var(--text-lg), 2vw, var(--text-2xl)); color: var(--play-ink); font-weight: var(--fw-semibold); min-height: 20px; animation: fade-up var(--dur-fast) var(--ease-out); }
  .feedback-note .icon-wrap { width: 30px; height: 30px; border-radius: 50%; background: var(--play-bg); color: var(--play); display: flex; align-items: center; justify-content: center; animation: pop-in var(--dur-slow) var(--ease-bounce); }

  .end-card { text-align: center; padding: var(--sp-6) 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; animation: fade-up var(--dur-base) var(--ease-out); }
  .end-card .icon-wrap { width: 52px; height: 52px; border-radius: 50%; background: var(--status-mastered-bg); color: var(--status-mastered); display: flex; align-items: center; justify-content: center; margin-bottom: 4px; animation: pop-in var(--dur-slow) var(--ease-bounce); }

  /* Overshoot pop for the celebration screen's Fizz circle (below).
     Its pulse ring is the existing --status-mastered teal, not a new hue: an
     amber/gold pulse was tried first but rejected on kid-ux review -- the
     shared token legend (styles.css) reserves amber for "stuck/needs-human",
     and a gold ring around a star reads like a coin/trophy token rather than
     a personal aha moment. One reward colour across the whole app. */
  @keyframes pop-in-mastery {
    0% { opacity: 0; transform: scale(0.3) rotate(-10deg); }
    60% { opacity: 1; transform: scale(1.35) rotate(6deg); }
    80% { transform: scale(0.92) rotate(-2deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  .end-card h2 { font-family: var(--display); font-size: clamp(var(--text-xl), 2.4vw, 32px); font-weight: 700; margin: 0; }
  .end-card p { color: var(--soft); max-width: 44ch; margin: 0; line-height: var(--lh-relaxed); }
  /* -------- the celebration screen (BACKLOG.md E2) --------
     showCelebration() in child.js: shown instead of the end card only when
     POST /evidence reports newlyMastered or patternsCracked. One big Fizz
     mid-cheer inside the teal pulse ring (the one reward colour), three
     teal sparkles that burst once, a heading, one line per concept, and the
     "See your star map" button. Centred in the screen, sized with clamp()s
     so it never scrolls the page. No digits, no counts. */
  .screen--celebrate { align-items: center; justify-content: center; overflow: hidden; }
  .celebrate {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    gap: clamp(var(--sp-2), 1.6vh, var(--sp-4)); padding: var(--sp-4) 10px; max-width: 40rem; min-height: 0;
    animation: fade-up var(--dur-base) var(--ease-out);
  }
  .celebrate-fizz {
    position: relative; display: flex; align-items: center; justify-content: center;
    width: clamp(112px, 32vh, 260px); height: clamp(112px, 32vh, 260px); border-radius: 50%;
    background: radial-gradient(closest-side, var(--panel) 30%, var(--status-mastered-bg) 100%);
    animation: pop-in-mastery var(--dur-celebrate) var(--ease-bounce), celebrate-ring 1.4s var(--ease-out) var(--dur-celebrate) 2;
  }
  .celebrate-fizz .fizz--lg { width: 72%; height: 72%; }
  @keyframes celebrate-ring {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--status-mastered) 45%, transparent); }
    75%, 100% { box-shadow: 0 0 0 clamp(16px, 4vh, 34px) transparent; }
  }
  .celebrate-sparkle { position: absolute; color: var(--status-mastered); pointer-events: none; animation: sparkle-once 900ms var(--ease-out) 500ms backwards; }
  .celebrate-sparkle svg { display: block; width: 100%; height: 100%; fill: currentColor; }
  .celebrate-sparkle--a { width: 22%; height: 22%; top: 2%; right: 2%; }
  .celebrate-sparkle--b { width: 14%; height: 14%; top: 26%; left: -2%; animation-delay: 700ms; }
  .celebrate-sparkle--c { width: 16%; height: 16%; bottom: 4%; right: -4%; animation-delay: 880ms; }
  .celebrate-title { margin: 0; font-family: var(--display); font-size: clamp(var(--text-2xl), 4.4vh, 44px); font-weight: 700; line-height: var(--lh-tight); color: var(--ink); }
  .celebrate-lines { display: flex; flex-direction: column; gap: var(--sp-1); min-height: 0; }
  .celebrate-line { margin: 0; max-width: 36ch; font-family: var(--display); font-size: clamp(var(--text-lg), 3vh, var(--text-2xl)); font-weight: 600; line-height: var(--lh-snug); color: var(--ink); }
  /* Bloom line is teal (the reward colour = bloom tier). The cracked line is
     plain ink: never --play orange, which on this surface means "Play / the
     next star", and would read as "go fix this one". */
  .celebrate-line--bloom { color: var(--status-mastered); }
  .celebrate-go { display: inline-flex; align-items: center; gap: var(--sp-2); min-height: 56px; font-family: var(--display); font-size: var(--text-xl); font-weight: 700; box-shadow: 0 6px 0 var(--play-ink), var(--shadow-md); }
  .celebrate-go .icon { width: 22px; height: 22px; }
  .celebrate-go:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--play-ink), var(--shadow-sm); }
  @media (prefers-reduced-motion: reduce) {
    .celebrate, .celebrate-fizz, .celebrate-sparkle { animation: none; }
  }
  @media (max-height: 480px) {
    .celebrate { padding: var(--sp-2) 10px; gap: var(--sp-1); }
    .celebrate-fizz { width: clamp(64px, 24vh, 112px); height: clamp(64px, 24vh, 112px); }
    .celebrate-go { min-height: 48px; margin-top: var(--sp-1); }
  }

  .btn-primary {
    margin-top: var(--sp-3); padding: var(--sp-3) var(--sp-7); min-height: 48px; border-radius: var(--r-pill); border: none;
    background: var(--play); color: var(--play-on); font-size: var(--text-base); font-weight: var(--fw-semibold); box-shadow: var(--shadow-sm);
    transition: background-color var(--dur-fast) var(--ease-standard), transform var(--dur-fast) var(--ease-standard), box-shadow var(--dur-fast) var(--ease-standard);
  }
  .btn-primary:hover { background: var(--play-ink); box-shadow: var(--shadow-md); }
  .btn-primary:active { transform: scale(0.96); box-shadow: var(--shadow-sm); }

  .empty-card { text-align: center; padding: var(--sp-8) 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; animation: fade-up var(--dur-base) var(--ease-out); }
  .empty-card .icon-wrap { width: 52px; height: 52px; border-radius: 50%; background: var(--rule-lite); color: var(--soft); display: flex; align-items: center; justify-content: center; margin-bottom: 4px; }
  .empty-card h2 { margin: 0; font-family: var(--display); font-size: clamp(var(--text-xl), 2.4vw, 32px); font-weight: 700; }
  .empty-card p { color: var(--soft); max-width: 40ch; margin: 0; line-height: var(--lh-relaxed); }

  .icon { width: 16px; height: 16px; display: inline-block; }

  /* -------------------- Star Path: the child's home map (BACKLOG.md #2) --------------------
     See showConstellation()/starNode() in child.js and "Star Path" in
     DESIGN_LANGUAGE.md. Every tier/next decision comes from GET
     /api/child/map -- this CSS only decides how a tier looks.

     Layout (.map-layout is a grid with three areas):
       wide (>=760px):  [ head  | trails ]     head = speech bubble above a big Fizz
                        [ play  | trails ]     play = the one Play button, under Fizz
       narrow:          [ head ] [ trails ] [ play ]   head = Fizz beside the bubble
     .const-scroll (trails) is the only internal scroll region. */

  .const-back { margin-left: auto; }
  .wrap:has(.screen--map) { max-width: 1240px; }

  .map-layout {
    flex: 1; min-height: 0; display: grid; gap: var(--sp-3) clamp(var(--sp-4), 2.4vw, var(--sp-7));
    grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "head" "trails" "play";
  }
  /* DOM order is bubble-then-Fizz (so wide mode stacks bubble above Fizz);
     narrow mode reverses it so Fizz stands left with the bubble's tail on it. */
  .map-head { grid-area: head; display: flex; flex-direction: row-reverse; align-items: center; justify-content: center; gap: var(--sp-3); min-width: 0; }
  .map-play-row { grid-area: play; display: flex; justify-content: center; }
  .const-scroll { grid-area: trails; }

  /* Fizz: one lg Fizz, re-mounted (hop) on every star tap. Narrow screens
     size it down; wide screens let it stand tall with a soft ground shadow. */
  .map-fizz { position: relative; flex-shrink: 0; display: flex; justify-content: center; }
  .map-fizz .fizz--lg { width: 60px; height: 60px; position: relative; z-index: 1; }
  .map-fizz::after {
    content: ""; position: absolute; left: 50%; bottom: -3px; width: 70%; height: 10px; transform: translateX(-50%);
    border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--ink) 16%, transparent), transparent);
  }

  /* The speech bubble: Fizz talking. Tail points left at Fizz by default
     (narrow map, picker); .map-layout's wide mode flips it to point down. */
  .speech-bubble {
    position: relative; flex: 0 1 auto; max-width: 46ch; min-height: 3.2em;
    display: flex; flex-direction: column; justify-content: center; gap: 2px;
    padding: var(--sp-3) var(--sp-4);
    background: var(--panel); border: 2px solid var(--rule-lite); border-radius: var(--r-xl); box-shadow: var(--shadow-md);
    animation: fade-up var(--dur-base) var(--ease-out);
  }
  .speech-bubble::before {
    content: ""; position: absolute; left: -9px; top: 50%; width: 16px; height: 16px; margin-top: -8px;
    background: var(--panel); border-left: 2px solid var(--rule-lite); border-bottom: 2px solid var(--rule-lite);
    transform: rotate(45deg); border-bottom-left-radius: 3px;
  }
  .speech-name { font-family: var(--display); font-size: clamp(var(--text-lg), 2vw, var(--text-2xl)); font-weight: 700; line-height: var(--lh-tight); color: var(--ink); }
  .speech-note { font-size: clamp(var(--text-md), 1.4vw, var(--text-lg)); color: var(--soft); line-height: var(--lh-snug); }
  .map-head .speech-bubble { flex: 1 1 auto; min-height: 4.4em; }

  @media (min-width: 760px) {
    .map-layout {
      grid-template-columns: clamp(220px, 24vw, 300px) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) auto;
      grid-template-areas: "head trails" "play trails";
    }
    /* Bubble above, Fizz below it, the pair centred in the column. The
       bubble's min-height is sized for its longest content (a two-line name
       plus a two-line note) so swapping the text on a tap never makes Fizz
       jump. */
    /* Top-aligned so the bubble lines up with the map card's top edge
       (centring it left a big empty band above the bubble on tall windows). */
    .map-head { flex-direction: column; justify-content: flex-start; gap: var(--sp-5); }
    /* z-index: a hop (up to ~half Fizz's height) tucks behind the bubble
       instead of jumping over its own words. */
    .map-head .speech-bubble { flex: 0 0 auto; width: 100%; max-width: none; min-height: clamp(96px, 18vh, 148px); text-align: center; padding: var(--sp-4); z-index: 2; }
    .map-head .speech-bubble::before { left: 50%; top: auto; bottom: -9px; margin-top: 0; transform: translateX(-50%) rotate(-45deg); }
    .map-fizz .fizz--lg { width: clamp(76px, 24vh, 200px); height: clamp(76px, 24vh, 200px); }
    .map-play-row .map-play { width: 100%; }
  }

  /* The trails live on one opaque "map" card (same role as .stage: blobs
     stay in the margins, never behind the stars), with a faint dot grid so
     it reads as a place, not a list. */
  .const-scroll {
    min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    container-type: inline-size; /* the trails' step length is sized off this card's width (cqi) */
    background:
      radial-gradient(circle, color-mix(in srgb, var(--hue-3) 14%, transparent) 1.2px, transparent 1.6px) 0 0 / 22px 22px,
      var(--panel);
    border: 1px solid var(--rule-lite); border-radius: var(--r-xl); box-shadow: var(--shadow-sm);
    animation: fade-up var(--dur-base) var(--ease-out);
  }
  .const-body {
    width: fit-content; max-width: 100%; margin: auto; min-height: 100%;
    display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
    gap: clamp(var(--sp-1), 1.2vh, var(--sp-3)); padding: clamp(var(--sp-3), 2vh, var(--sp-6)) clamp(var(--sp-3), 2.4vw, var(--sp-7));
  }

  .trail { display: flex; flex-direction: column; align-items: flex-start; gap: 0; }
  /* A small wooden-signpost-ish label: sand pill, display face, words only. */
  .const-strand-title {
    margin: 0; padding: 1px var(--sp-3); border-radius: var(--r-pill);
    font-family: var(--display); font-size: clamp(var(--text-md), 1.4vw, var(--text-lg)); font-weight: 700; line-height: var(--lh-snug);
    color: var(--soft); background: color-mix(in srgb, var(--hue-3) 12%, var(--panel));
  }

  /* One short, winding trail per strand, prerequisite-first. Stars sit
     alternately a little above/below the row's midline (.trail-slot--up/
     --down) and each .trail-step between two stars is a tiny SVG S-curve
     from one star's centre height to the next -- so the connector is a
     winding sandy path with a dotted "footstep" line, not a straight rule.
     Sizes are all derived from --star so geometry holds at any width:
     --wave is the vertical offset, and a step's height is exactly 2*--wave
     so its ends land on the adjacent stars' centre lines. The path is ONE
     neutral sand material for every strand on purpose: blue, purple and
     teal already mean glow/fading/bloom here, so strand-coloured trails
     would muddy the tier colours. */
  .trail-row {
    --star: clamp(44px, min(5vw, 7.4vh), 62px);
    --wave: calc(var(--star) * 0.2);
    /* Step length stretches the LONGEST trail to fill the map card instead of
       leaving its right third empty on wide screens. --stars / --steps are
       the longest row's star and connector counts (set on .const-body by
       showConstellation); the subtracted terms are the stars themselves (next
       star is ~a third bigger), the body + row padding and the trailing dots. */
    --step: clamp(12px, calc((100cqi - var(--stars, 5) * var(--star) * 1.1 - 0.34 * var(--star) - 2 * clamp(12px, 2.4vw, 32px) - 64px) / var(--steps, 5)), 110px);
    position: relative; display: flex; align-items: center;
    min-height: calc(var(--star) * 1.34 + 2 * var(--wave) + 6px);
    padding-inline: 10px;
  }
  .trail-slot--up { top: calc(-1 * var(--wave)); }
  .trail-slot--down { top: var(--wave); }
  .trail-step {
    position: relative; z-index: 0; flex: 0 0 auto;
    width: calc(var(--step) + 8px); height: calc(2 * var(--wave)); margin-inline: -4px;
    pointer-events: none;
  }
  .trail-step svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .trail-road { fill: none; stroke: color-mix(in srgb, var(--hue-3) 14%, var(--panel)); stroke-width: 12px; stroke-linecap: round; }
  .trail-dots { fill: none; stroke: color-mix(in srgb, var(--hue-3) 42%, var(--rule)); stroke-width: 3px; stroke-linecap: round; stroke-dasharray: 0.1 7; }
  /* The trail fades out past the last authored star into three soft dots:
     "this path keeps going later", never a dead seed. */
  .trail-step--fade { -webkit-mask-image: linear-gradient(90deg, #000 20%, transparent); mask-image: linear-gradient(90deg, #000 20%, transparent); }
  .trail-more { position: relative; display: inline-flex; gap: 5px; padding-left: 2px; }
  .trail-more span { width: 6px; height: 6px; border-radius: 50%; background: color-mix(in srgb, var(--hue-3) 30%, var(--rule)); }
  .trail-more span:nth-child(2) { opacity: 0.7; }
  .trail-more span:nth-child(3) { opacity: 0.4; }
  .trail-coming { margin: var(--sp-2) 0 0; max-width: 48ch; color: var(--soft); font-size: var(--text-md); line-height: var(--lh-snug); }

  /* -------- the star button, shared by every tier --------
     Tier changes size (--k), fill and ring -- never position. Stars stay
     real buttons >=42px at every tier and viewport. */
  .const-star {
    --k: 1;
    position: relative; z-index: 1; flex-shrink: 0;
    width: max(42px, calc(var(--star) * var(--k))); height: max(42px, calc(var(--star) * var(--k)));
    padding: 0; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--rule); background: var(--panel);
    transition: transform var(--dur-fast) var(--ease-bounce), outline-color var(--dur-fast) var(--ease-standard);
    outline: 3px solid transparent; outline-offset: 4px;
    /* Twinkle-in on load, staggered via inline animation-delay (starNode).
       One-shot; `backwards` so hover transforms win afterwards. */
    animation: pop-in var(--dur-slow) var(--ease-bounce) backwards;
  }
  .const-star .icon { width: 50%; height: 50%; position: relative; z-index: 1; }
  .const-star .icon svg { stroke-width: 1.8; }
  .const-star:hover { transform: translateY(-3px) scale(1.04); }
  .const-star:active { transform: scale(0.94); }
  .const-star:focus-visible, .const-star--selected { outline-color: color-mix(in srgb, var(--ink) 55%, transparent); }

  /* Small four-point sparkles (starNode adds them to bloom + fading only). */
  .star-sparkle { position: absolute; z-index: 2; pointer-events: none; color: var(--status-mastered); display: block; }
  .star-sparkle svg { display: block; width: 100%; height: 100%; fill: currentColor; }
  .star-sparkle--a { width: 34%; height: 34%; top: -12%; right: -10%; }
  .star-sparkle--b { width: 20%; height: 20%; bottom: -2%; left: -8%; }

  /* SEED -- "not yet": smaller, a hollow dashed outline on a sunk fill,
     star drawn as a faint outline. Categorically quieter than every other tier. */
  .const-star--seed {
    --k: 0.84;
    border-style: dashed; border-color: color-mix(in srgb, var(--status-unmeasured) 70%, var(--rule));
    background: var(--panel-sunk); color: var(--status-unmeasured);
  }
  .const-star--seed .icon { width: 44%; height: 44%; }
  .const-star--seed .icon svg { fill: none; }

  /* GLOW -- "growing": full size, solid blue ring, star half filled.
     EMERGING and STUCK share it -- STUCK must never read as alarming. */
  .const-star--glow {
    border: 2.5px solid var(--status-emerging); color: var(--status-emerging);
    background: radial-gradient(circle at 50% 38%, var(--panel) 0%, var(--status-emerging-bg) 70%);
  }
  .const-star--glow .icon svg { fill: currentColor; fill-opacity: 0.35; }

  /* BLOOM -- "earned": the biggest resting star, a solid teal disc with a
     bright white filled star, a pale teal halo ring and two teal sparkles.
     Teal is the app's one reward colour; only a mastered star uses it. */
  .const-star--bloom {
    --k: 1.14;
    border: 2px solid var(--status-mastered); color: #fff;
    background: radial-gradient(circle at 36% 30%, color-mix(in srgb, var(--status-mastered) 72%, white) 0%, var(--status-mastered) 62%);
    box-shadow: 0 0 0 5px var(--status-mastered-bg), 0 6px 18px color-mix(in srgb, var(--status-mastered) 34%, transparent);
  }
  .const-star--bloom .icon { width: 54%; height: 54%; }
  .const-star--bloom .icon svg { fill: currentColor; stroke-width: 1.4; }
  /* Sparkles twinkle ONCE, right after the map's pop-in cascade, then rest. */
  .const-star--bloom .star-sparkle { animation: sparkle-once 900ms var(--ease-out) 700ms backwards; }
  .const-star--bloom .star-sparkle--b { animation-delay: 850ms; }
  @keyframes sparkle-once {
    0% { opacity: 0; transform: scale(0.2) rotate(-30deg); }
    60% { opacity: 1; transform: scale(1.25) rotate(10deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  /* FADING -- "a little dim, still yours": the SAME filled-star-with-sparkle
     shape as bloom, just softened into lavender -- so it reads as a star
     that's gone quiet, not a broken or empty one. Deliberately static (a map
     can hold 5-8 of these; pulsing them all at once was too busy). */
  .const-star--fading {
    border: 2px solid color-mix(in srgb, var(--status-decayed) 45%, var(--rule-lite));
    color: color-mix(in srgb, var(--status-decayed) 70%, var(--panel));
    background: radial-gradient(circle at 36% 30%, var(--panel) 0%, var(--status-decayed-bg) 70%);
  }
  .const-star--fading .icon svg { fill: currentColor; fill-opacity: 0.55; }
  .const-star--fading .star-sparkle { color: color-mix(in srgb, var(--status-decayed) 45%, var(--panel)); }
  .const-star--fading .star-sparkle--b { display: none; }

  /* NEXT -- the one server-chosen star, and the screen's focal point: the
     largest star, a coral (--play, the page accent -- never teal) ring on a
     warm fill, a soft halo that breathes, and a ring that ripples outward.
     It is the ONLY continuously animated star on the map. It overrides the
     underlying tier's colours (a fading star can be `next`; its sparkle is
     hidden so the two treatments never fight) -- Fizz's bubble still says
     which kind of star it is when tapped. */
  .const-star--next {
    --k: 1.34;
    border: 3px solid var(--play); color: var(--play);
    background: radial-gradient(circle at 50% 36%, var(--panel) 0%, var(--play-bg) 72%);
    box-shadow: 0 0 0 5px color-mix(in srgb, var(--play) 16%, transparent), 0 8px 22px color-mix(in srgb, var(--play) 30%, transparent);
  }
  .const-star--next .icon { width: 54%; height: 54%; }
  .const-star--next .icon svg { fill: currentColor; fill-opacity: 0.85; stroke: var(--play-ink); }
  .const-star--next .star-sparkle { display: none; }
  .const-star--next::after {
    content: ""; position: absolute; inset: -22%; border-radius: 50%; z-index: -1; pointer-events: none;
    /* Transparent over the star itself (the halo box is ~1.44x the star, so
       the star's edge sits at ~69% of closest-side) -- the glow only ever
       shows around the star, never tints its face. */
    background: radial-gradient(closest-side, transparent 62%, color-mix(in srgb, var(--play) 46%, transparent) 70%, transparent 100%);
    animation: star-next-glow 2.4s ease-in-out infinite;
  }
  .const-star--next::before {
    content: ""; position: absolute; inset: -5px; border-radius: 50%; z-index: -1; pointer-events: none;
    border: 3px solid color-mix(in srgb, var(--play) 55%, transparent);
    animation: star-next-ripple 2.4s var(--ease-out) infinite;
  }
  @keyframes star-next-glow {
    0%, 100% { opacity: 0.6; transform: scale(0.92); }
    50% { opacity: 1; transform: scale(1.06); }
  }
  @keyframes star-next-ripple {
    0% { opacity: 0.9; transform: scale(1); }
    70%, 100% { opacity: 0; transform: scale(1.45); }
  }

  .map-play {
    margin-top: 0; min-height: 60px; min-width: clamp(180px, 30vw, 260px);
    display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
    font-family: var(--display); font-size: var(--text-2xl); font-weight: 700;
    box-shadow: 0 6px 0 var(--play-ink), var(--shadow-md);
  }
  .map-play:hover { box-shadow: 0 6px 0 color-mix(in srgb, var(--play-ink) 80%, black), var(--shadow-md); }
  .map-play:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--play-ink), var(--shadow-sm); }
  .map-play .icon { width: 22px; height: 22px; }

  /* JUST BLOOMED -- one-shot arrival from the celebration screen. A copy of
     the glow tier (.star-was-glow: blue ring, half-filled star) sits over
     the bloom star and melts away after the pop-in cascade, while the star
     itself swells once and throws a single teal ring: glow -> bloom, once.
     JUST CRACKED -- the star keeps its own tier and gets one teal ring only.
     Neither loops; the `next` star stays the map's only continuous motion. */
  .star-was-glow {
    position: absolute; inset: -2px; z-index: 3; border-radius: 50%; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    border: 2.5px solid var(--status-emerging); color: var(--status-emerging);
    background: radial-gradient(circle at 50% 38%, var(--panel) 0%, var(--status-emerging-bg) 70%);
    opacity: 0; animation: star-glow-melt 1100ms var(--ease-out) 650ms backwards;
  }
  .star-was-glow .icon { width: 50%; height: 50%; }
  .star-was-glow .icon svg { fill: currentColor; fill-opacity: 0.35; stroke-width: 1.8; }
  @keyframes star-glow-melt {
    0%, 30% { opacity: 1; transform: scale(0.88); }
    100% { opacity: 0; transform: scale(1.3); }
  }
  .const-star--just-bloomed { animation: pop-in var(--dur-slow) var(--ease-bounce) backwards, star-bloom-swell 900ms var(--ease-bounce) 900ms, star-bloom-ring 1200ms var(--ease-out) 1000ms; }
  .const-star--just-bloomed .star-sparkle { animation-delay: 1300ms; }
  .const-star--just-bloomed .star-sparkle--b { animation-delay: 1450ms; }
  .const-star--just-cracked { animation: pop-in var(--dur-slow) var(--ease-bounce) backwards, star-bloom-ring 1200ms var(--ease-out) 800ms 2; }
  @keyframes star-bloom-swell {
    0% { transform: scale(0.9); }
    50% { transform: scale(1.28); }
    100% { transform: scale(1); }
  }
  @keyframes star-bloom-ring {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--status-mastered) 55%, transparent); }
    100% { box-shadow: 0 0 0 22px transparent; }
  }

  @media (prefers-reduced-motion: reduce) {
    .const-star, .const-star--bloom .star-sparkle, .const-scroll, .speech-bubble { animation: none; }
    .star-was-glow { display: none; }
    .const-star--next::after { animation: none; opacity: 1; }
    .const-star--next::before { animation: none; opacity: 0; }
    .const-star:hover { transform: none; }
  }

  /* -------------------- balance scale (BACKLOG.md "Balance Scale") --------------------
     Purely additive -- does not touch .choice-card/.bar-outer/.line-track/
     .icon-wrap/pop-in/the path track above. A new SVG skin (beam-and-two-
     pans), display-only: see renderBalanceScale() in child.js. The beam's
     rotation is driven by the SVG `transform` attribute directly (not
     inline CSS transform-origin math) so `rotate(angle cx cy)` can pivot
     around the beam's own local origin regardless of its bounding box --
     the `transition: transform` below still animates attribute changes to
     it. The pans themselves are no longer tap targets (reworked per
     pedagogy-reviewer REQUIRED CHANGES -- F.EQV is an equivalence
     judgement, "does it balance?", not "which pan is bigger?"); the real
     tap targets are .balance-choice below. */
  .balance-area { width: 100%; touch-action: none; }
  /* This item type stacks a prompt, a subprompt, this beam, and a row of
     choice buttons -- the tallest combination of any item type the stage
     renders -- so its own height budget is deliberately tighter than the
     numberline/choice svgs above rather than sharing their clamp. */
  .balance-area svg { width: 100%; height: clamp(120px, 24vh, 300px); display: block; }
  .balance-base { stroke: var(--ink); stroke-width: 3; }
  .balance-fulcrum { fill: var(--panel); stroke: var(--ink); stroke-width: 2; }
  .balance-beam { transition: transform var(--dur-slow) var(--ease-bounce); }
  .balance-beam-line { stroke: var(--ink); stroke-width: 4; stroke-linecap: round; }
  .balance-pivot-cap { fill: var(--ink); }
  .balance-string { stroke: var(--soft); stroke-width: 1.5; }
  .balance-pan { fill: var(--panel); stroke: var(--ink); stroke-width: 1.5; }
  .balance-pan-label { font-family: var(--mono); font-size: var(--text-sm); fill: var(--ink); }

  /* The actual tap targets for this game -- two big forced-choice buttons
     below the (now display-only) beam. Sized comfortably beyond kid-ux's
     ~52x66px minimum for this age group (min-height 66px here, full-width
     flex share of a 500px-ish stage well over 52px wide each) -- same
     touch-target generosity kid-ux's original balance-hit fix established,
     carried over to the new tap surface rather than lost in the rework. */
  .balance-choice-row { gap: var(--sp-3); }
  .balance-choice {
    flex: 1; min-height: 66px; min-width: 52px; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: var(--sp-3) var(--sp-3); border: 2px solid var(--rule); border-radius: var(--r-lg);
    background: var(--panel); font-size: var(--text-lg); font-weight: var(--fw-semibold); color: var(--ink);
    transition: border-color var(--dur-fast) var(--ease-standard), background-color var(--dur-fast) var(--ease-standard), box-shadow var(--dur-fast) var(--ease-standard), transform var(--dur-fast) var(--ease-standard);
  }
  .balance-choice:hover { border-color: var(--play); cursor: pointer; box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .balance-choice:active { transform: translateY(0) scale(0.97); box-shadow: var(--shadow-sm); }
  /* Purple/amber -- distinct from the blue/magenta pair renderCompare and
     renderPartition use above, so the palette reads as varied across game
     types rather than the same two colors everywhere -- neither is "the
     reward color" (that's --status-mastered alone, see DESIGN_LANGUAGE.md). */
  .balance-choice[data-hue="4"] { background: color-mix(in srgb, var(--hue-4) 8%, var(--panel)); border-color: color-mix(in srgb, var(--hue-4) 30%, var(--rule)); }
  .balance-choice[data-hue="4"]:hover { border-color: var(--hue-4); }
  .balance-choice[data-hue="3"] { background: color-mix(in srgb, var(--hue-3) 8%, var(--panel)); border-color: color-mix(in srgb, var(--hue-3) 30%, var(--rule)); }
  .balance-choice[data-hue="3"]:hover { border-color: var(--hue-3); }

  /* -------------------- small-screen safety net -------------------- */
  /* This is a K-5 play surface, so phone-width is the *primary* target, not
     an edge case -- the clamp()s above already hold up down to ~320px, this
     just drops the roster to two columns of (still big) avatar cards. */
  @media (max-width: 640px) {
    .picker { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .picker-play { min-height: clamp(96px, 17vh, 170px); }
    /* A five-star trail must fit a ~400px-wide phone without sideways scroll. */
    .trail-row { --step: 12px; padding-inline: 4px; }
    .const-body { padding-inline: var(--sp-2); }
  }
  /* A short viewport (landscape phone, a small laptop with browser chrome)
     is the case where "no scrolling" is actually at risk -- the clamp()s
     above are vh-driven, so they already shrink here, but the gap between
     stacked sections is what eats the rest of the room. The balance-scale
     item (prompt+subprompt+beam+two buttons, the tallest stack this stage
     renders) is the one that still doesn't fit at the shortest realistic
     heights even with every clamp at its minimum -- past that point the
     honest move is dropping the one non-essential row (the subprompt is
     restated by the prompt + the interaction itself) rather than clipping
     or forcing a scrollbar mid-question. */
  @media (max-height: 480px) {
    .wrap { gap: 4px; }
    .screen { gap: var(--sp-2); }
    .stage { gap: 8px; padding-block: 8px; }
    .path-wrap { gap: 3px; }
    .path-track { height: 44px; }
    .subprompt { display: none; }
    .line-area svg, .balance-area svg { height: clamp(70px, 18vh, 150px); }
    .partition-shape { height: clamp(44px, 11vh, 100px); }
    .choice-card { min-height: 70px; }
    .balance-choice { min-height: 44px; }
    .line-lock { min-height: 40px; padding-block: var(--sp-1); font-size: var(--text-lg); }
    .session-home { min-height: 38px; }
    /* Picker: Fizz shrinks and cards go horizontal (avatar beside name). */
    .picker-head { padding-top: 0; }
    .picker-head .fizz--lg { width: 44px; height: 44px; }
    .picker-head h1 { font-size: var(--text-2xl); }
    .picker-head .speech-bubble { padding: 6px var(--sp-3); min-height: 0; }
    .picker-play { flex-direction: row; min-height: clamp(56px, 16vh, 88px); padding: var(--sp-2) var(--sp-3); gap: var(--sp-2); border-radius: var(--r-lg); }
    .picker-avatar.avatar { width: 38px; height: 38px; font-size: var(--text-md); box-shadow: 0 0 0 3px var(--panel); }
    .picker-name { font-size: var(--text-lg); }
    /* Star Path: shrink the fixed rows so the trail scroller keeps room. */
    .map-fizz .fizz--lg { width: 40px; height: 40px; }
    .speech-bubble, .map-head .speech-bubble { padding: 6px var(--sp-3); min-height: 0; }
    .speech-name { font-size: var(--text-lg); }
    .speech-note { font-size: var(--text-sm); }
    .const-body { padding-block: var(--sp-2); gap: 2px; }
    .trail-row { --star: 42px; --wave: 7px; }
    .map-play { min-height: 46px; font-size: var(--text-xl); box-shadow: 0 4px 0 var(--play-ink), var(--shadow-sm); }
  }
  /* Short AND wide (landscape phone, small laptop): two-column map, so put
     each strand's signpost beside its trail instead of above it. */
  @media (max-height: 480px) and (min-width: 760px) {
    .map-head { gap: var(--sp-2); }
    .map-fizz .fizz--lg { width: 52px; height: 52px; }
    .trail { flex-direction: row; align-items: center; gap: var(--sp-2); }
    .const-strand-title { min-width: 7.5em; text-align: center; }
    .trail-row { --step: clamp(12px, 2.4vw, 40px); }
  }
</style>
</head>

<span class="bg-blob bg-blob--1" aria-hidden="true"></span>
<span class="bg-blob bg-blob--2" aria-hidden="true"></span>
<span class="bg-blob bg-blob--3" aria-hidden="true"></span>
<span class="bg-blob bg-blob--4" aria-hidden="true"></span>
<div class="wrap">
  <div id="app"></div>
</div>
